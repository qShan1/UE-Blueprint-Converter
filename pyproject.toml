[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-bp-converter"
version = "0.1.0"
description = "UE Blueprint Converter CLI tool"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
ue-bp-converter = "ue_bp_converter.cli:main"
ue-bp-visualizer = "start:main"

[tool.setuptools.packages.find]
include = ["ue_bp_converter*"]